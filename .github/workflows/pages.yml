name: Deploy public dictionary demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the public site
        run: |
          mkdir -p _site/frequency
          rsync -a --exclude='.openai/' --exclude='dist/' terra-luna-site/ _site/
          cp reports/frequency_dictionary_analysis/index.html _site/frequency/
          cp reports/frequency_dictionary_analysis/data.js _site/frequency/
          find _site -type f -name '*.html' -exec sed -i 's|href="/|href="/jitendex-translations/|g' {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
