[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jitendex-translations"
version = "0.1.0"
description = "Auditable Kaishi-scoped Jitendex Russian translation pipeline"
requires-python = ">=3.12"
dependencies = ["fastjsonschema>=2.21", "psycopg[binary,pool]==3.2.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
translationctl = "jitendex_ru.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
